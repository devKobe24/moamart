plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'application'
}

group = 'com.kobe.moamart'
version = '0.0.1-SNAPSHOT'
description = 'moamart'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

bootJar {
    archiveFileName = 'moa-mart-1.0.5.jar'
}

repositories {
    mavenCentral()
}

dependencies {
    // 1. Web & Thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6' // Security 연동

    // 2. Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 3. Database (JPA, MySQL, H2)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    // 4. QueryDSL (Spring Boot 3.x 필승 조합)
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // 5. Utilities
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-validation' // 유효성 검사
    
    // 7. AWS S3 (운영 환경 이미지 업로드용)
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.529'
    
    // 8. AWS Secrets Manager (운영 환경 자격 증명 관리용)
    implementation 'com.amazonaws:aws-java-sdk-secretsmanager:1.12.529'
    
    // 9. 이미지 처리 (리사이징, 최적화)
    implementation 'net.coobird:thumbnailator:0.4.20'

    // 10. Spring Cloud AWS
    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:3.0.0')
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager'

    // 6. Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// QueryDSL Build Options (QClass 생성 위치 지정 - 선택사항이지만 IDE 인식을 위해 추천)
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile) {
    options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

clean.doLast {
    file(querydslDir).deleteDir()
}
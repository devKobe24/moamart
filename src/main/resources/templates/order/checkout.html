<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주문/결제 - Moamart</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Apple SD Gothic Neo", sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
      }

      .checkout-container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        gap: 20px;
      }

      .checkout-header {
        font-size: 1.5em;
        font-weight: bold;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .header-buttons {
        display: flex;
        gap: 10px;
      }

      .header-btn {
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 17.6px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        display: inline-block;
      }

      .header-btn:hover {
        background-color: #0056b3;
        text-decoration: none;
      }

      .checkout-left {
        flex: 1;
      }

      .checkout-right {
        width: 380px;
      }

      .section {
        background: white;
        border-radius: 8px;
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      .section-title {
        font-size: 1.1em;
        font-weight: 600;
        margin-bottom: 16px;
        color: #111827;
      }

      /* 주문 상품 정보 */
      .product-info {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .product-image {
        width: 60px;
        height: 84px;
        object-fit: cover;
        border-radius: 6px;
        background-color: #f3f4f6;
        border: 1px solid #e5e7eb;
      }

      .product-details {
        flex: 1;
      }

      .product-name {
        font-weight: 600;
        color: #111827;
        margin-bottom: 4px;
      }

      .product-option {
        font-size: 0.9em;
        color: #6b7280;
        margin-bottom: 4px;
      }

      .product-price {
        font-weight: 600;
        color: #111827;
      }

      /* 배송지 정보 */
      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        font-size: 0.9em;
        color: #374151;
        margin-bottom: 6px;
        font-weight: 500;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        font-size: 14px;
        font-family: "Apple SD Gothic Neo", sans-serif;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 80px;
      }

      .address-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .load-default-btn {
        padding: 6px 12px;
        background: #f3f4f6;
        color: #374151;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        font-size: 0.85em;
        cursor: pointer;
      }

      .load-default-btn:hover {
        background: #e5e7eb;
      }

      .address-row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }

      .address-row input {
        flex: 1;
      }

      .address-row button {
        padding: 10px 16px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
      }

      .address-row button:hover {
        background: #0056b3;
      }

      #wrap {
        display: none;
        border: 1px solid #888;
        width: 100%;
        height: 300px;
        margin: 5px 0;
        position: relative;
      }

      #btnFoldWrap {
        cursor: pointer;
        position: absolute;
        right: 0px;
        top: -1px;
        z-index: 1;
      }

      /* 할인 적용 섹션 */
      .discount-section {
        border-top: 1px solid #e5e7eb;
        padding-top: 16px;
      }

      .discount-toggle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        padding: 8px;
        border-radius: 6px;
        transition: background-color 0.2s;
      }

      .discount-toggle:hover {
        background-color: #f9fafb;
      }

      .discount-content {
        display: none;
        margin-top: 12px;
      }

      .discount-content.show {
        display: block;
      }

      /* 결제 방법 */
      .payment-option {
        margin-bottom: 16px;
        padding: 12px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        transition: border-color 0.2s;
        cursor: pointer;
      }

      .payment-option.selected {
        border-color: #007bff;
        background-color: #f0f7ff;
      }

      .payment-option input[type="radio"] {
        margin-right: 8px;
        cursor: pointer;
      }

      .payment-option label {
        font-weight: 500;
        cursor: pointer;
        display: block;
      }

      .payment-details {
        margin-top: 12px;
        display: none;
      }

      .payment-option.selected .payment-details {
        display: block;
      }

      .payment-details select {
        width: 100%;
        padding: 8px;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        font-size: 14px;
        font-family: "Apple SD Gothic Neo", sans-serif;
      }

      /* 결제 요약 */
      .summary-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 0.95em;
      }

      .summary-row.total {
        font-size: 1.2em;
        font-weight: bold;
        color: #007bff;
        padding-top: 16px;
        border-top: 2px solid #e5e7eb;
        margin-top: 16px;
      }

      .summary-label {
        color: #6b7280;
      }

      .summary-value {
        color: #111827;
        font-weight: 600;
      }

      .summary-value.total {
        color: #007bff;
        font-size: 1.3em;
      }

      .agreement-checkbox {
        margin: 20px 0;
        padding: 12px;
        background-color: #f9fafb;
        border-radius: 6px;
      }

      .agreement-checkbox input[type="checkbox"] {
        margin-right: 8px;
        cursor: pointer;
      }

      .agreement-checkbox label {
        font-size: 0.9em;
        color: #374151;
        cursor: pointer;
      }

      .payment-btn {
        width: 100%;
        padding: 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.1em;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .payment-btn:hover {
        background-color: #0056b3;
      }

      .payment-btn:disabled {
        background-color: #9ca3af;
        cursor: not-allowed;
      }

      .error-msg {
        background-color: #ffebee;
        color: #c62828;
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 20px;
      }

      /* 모바일 대응 */
      @media (max-width: 768px) {
        body {
          padding: 10px;
        }

        .checkout-container {
          flex-direction: column;
        }

        .checkout-right {
          width: 100%;
        }

        .section {
          padding: 16px;
        }

        .address-row {
          flex-direction: column;
        }

        .address-row button {
          width: 100%;
        }

        #wrap {
          height: 400px;
        }

        .checkout-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 15px;
        }

        .header-buttons {
          width: 100%;
          flex-direction: column;
        }

        .header-btn {
          width: 100%;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="checkout-container">
      <div class="checkout-left">
        <div class="checkout-header">
          <span>주문/결제</span>
          <div class="header-buttons">
            <a href="/cart" class="header-btn">장바구니</a>
            <a href="/" class="header-btn">계속 쇼핑하기</a>
          </div>
        </div>

        <!-- 정보 입력 -->
        <div class="section">
          <h3 class="section-title">정보 입력</h3>

          <div
            th:if="${errorMessage}"
            class="error-msg"
            th:text="${errorMessage}"
          >
            에러 메시지
          </div>

          <!-- 주문 상품 정보 -->
          <div
            class="section-title"
            style="font-size: 0.95em; margin-bottom: 12px; margin-top: 20px"
          >
            주문 상품 정보
          </div>
          <div th:each="item : ${cart}">
            <div class="product-info" style="margin-bottom: 12px">
              <img
                th:if="${item.thumbnailUrl != null}"
                th:src="${item.thumbnailUrl}"
                th:alt="${item.name}"
                class="product-image"
              />
              <div
                th:unless="${item.thumbnailUrl != null}"
                class="product-image"
                style="
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: #9ca3af;
                  font-size: 12px;
                "
              >
                No Image
              </div>
              <div class="product-details">
                <div class="product-name" th:text="${item.name}"></div>
                <div
                  class="product-option"
                  th:text="'수량 ' + ${item.quantity} + '개'"
                ></div>
                <div
                  class="product-price"
                  th:text="'₩' + ${#numbers.formatInteger(item.getTotalPrice(), 0, 'COMMA')}"
                ></div>
              </div>
            </div>
          </div>

          <!-- 픽업 매장 정보 -->
          <div
            class="section-title"
            style="font-size: 0.95em; margin-bottom: 12px; margin-top: 20px"
          >
            픽업 매장 정보
          </div>
          <div
            style="
              padding: 16px;
              background-color: #f0f7ff;
              border-radius: 8px;
              margin-bottom: 20px;
            "
          >
            <div
              style="font-weight: 600; color: #111827; margin-bottom: 8px"
              th:text="${store.name}"
            >
              모아마트
            </div>
            <div
              style="font-size: 0.9em; color: #6b7280; margin-bottom: 4px"
              th:text="${store.address}"
            >
              서울특별시 강남구
            </div>
            <div
              style="font-size: 0.9em; color: #6b7280"
              th:text="${store.phoneNumber}"
            >
              02-1234-5678
            </div>
            <div
              style="
                margin-top: 12px;
                padding-top: 12px;
                border-top: 1px solid #e5e7eb;
              "
            >
              <div
                style="
                  font-size: 0.9em;
                  color: #6b7280;
                  display: flex;
                  align-items: center;
                  gap: 8px;
                  flex-wrap: wrap;
                "
              >
                <span>픽업 예정일:</span>
                <span
                  style="font-weight: 600; color: #007bff"
                  id="pickup-date"
                  th:text="${#temporals.format(#temporals.createToday(), 'yyyy년 MM월 dd일')}"
                  >오늘</span
                >
                <select
                  id="pickup-hour"
                  name="pickupHour"
                  style="
                    padding: 4px 8px;
                    border: 1px solid #e5e7eb;
                    border-radius: 4px;
                    font-size: 0.9em;
                    background-color: white;
                  "
                >
                  <option value="09">09</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                  <option value="13">13</option>
                  <option value="14">14</option>
                  <option value="15">15</option>
                  <option value="16">16</option>
                  <option value="17">17</option>
                  <option value="18">18</option>
                  <option value="19">19</option>
                  <option value="20">20</option>
                </select>
                <span>시</span>
                <select
                  id="pickup-minute"
                  name="pickupMinute"
                  style="
                    padding: 4px 8px;
                    border: 1px solid #e5e7eb;
                    border-radius: 4px;
                    font-size: 0.9em;
                    background-color: white;
                  "
                >
                  <option value="00">00</option>
                  <option value="10">10</option>
                  <option value="20">20</option>
                  <option value="30">30</option>
                  <option value="40">40</option>
                  <option value="50">50</option>
                </select>
                <span>분</span>
              </div>
            </div>
          </div>

          <!-- 봉투 정보 -->
          <div
            class="section-title"
            style="font-size: 0.95em; margin-bottom: 12px; margin-top: 20px"
            th:if="${bagType != null && bagType != T(com.kobe.moamart.domain.order.entity.BagType).NONE}"
          >
            선택한 봉투
          </div>
          <div
            th:if="${bagType != null && bagType != T(com.kobe.moamart.domain.order.entity.BagType).NONE}"
            style="
              padding: 16px;
              background-color: #f9fafb;
              border-radius: 8px;
              margin-bottom: 20px;
            "
          >
            <div style="font-weight: 500; color: #111827">
              <span
                th:if="${bagType == T(com.kobe.moamart.domain.order.entity.BagType).BAG_10L}"
                >10L 봉투</span
              >
              <span
                th:if="${bagType == T(com.kobe.moamart.domain.order.entity.BagType).BAG_20L}"
                >20L 봉투</span
              >
              <span
                style="color: #6b7280; margin-left: 8px"
                th:text="'(+₩' + ${#numbers.formatInteger(bagPrice, 0, 'COMMA')} + ')'"
              ></span>
            </div>
          </div>

          <!-- 픽업자 정보 -->
          <div
            class="section-title"
            style="font-size: 0.95em; margin-bottom: 12px; margin-top: 20px"
          >
            픽업자 정보
          </div>

          <form id="checkout-form" action="/orders/checkout" method="post">
            <input type="hidden" name="storeId" th:value="${storeId}" />
            <input type="hidden" name="bagType" th:value="${bagType}" />
            <input type="hidden" name="pickupHour" id="hidden-pickup-hour" />
            <input
              type="hidden"
              name="pickupMinute"
              id="hidden-pickup-minute"
            />

            <div class="form-group">
              <label for="recipient-name">이름</label>
              <input
                type="text"
                id="recipient-name"
                name="recipientName"
                placeholder="이름을 입력하세요"
                required
              />
            </div>

            <div class="form-group">
              <label for="recipient-phone">연락처</label>
              <input
                type="tel"
                id="recipient-phone"
                name="phoneNumber"
                placeholder="연락처를 입력하세요 (예: 010-1234-5678)"
                required
              />
            </div>

            <!-- 할인 적용 -->
            <div class="discount-section">
              <div class="discount-toggle" onclick="toggleDiscount()">
                <span>할인 적용</span>
                <span id="discount-arrow">▼</span>
              </div>
              <div class="discount-content" id="discount-content">
                <div class="form-group">
                  <input
                    type="text"
                    placeholder="할인 코드 또는 쿠폰 코드를 입력하세요"
                  />
                </div>
              </div>
            </div>

            <!-- 결제 방법 -->
            <div
              class="section-title"
              style="font-size: 0.95em; margin-bottom: 12px; margin-top: 20px"
            >
              결제 방법
            </div>

            <div
              class="payment-option"
              onclick="selectPayment('CREDIT_CARD', this)"
            >
              <label>
                <input type="radio" name="paymentMethod" value="CREDIT_CARD" />
                신용카드
              </label>
              <div class="payment-details">
                <select>
                  <option>신용카드를 선택하세요</option>
                  <option>삼성카드</option>
                  <option>KB카드</option>
                  <option>신한카드</option>
                  <option>하나카드</option>
                  <option>롯데카드</option>
                  <option>NH카드</option>
                </select>
              </div>
            </div>

            <div
              class="payment-option"
              onclick="selectPayment('NAVER_PAY', this)"
            >
              <label>
                <input type="radio" name="paymentMethod" value="NAVER_PAY" />
                네이버페이
              </label>
            </div>

            <div
              class="payment-option"
              onclick="selectPayment('KAKAO_PAY', this)"
            >
              <label>
                <input type="radio" name="paymentMethod" value="KAKAO_PAY" />
                카카오페이
              </label>
            </div>

            <div
              class="payment-option"
              onclick="selectPayment('BANK_TRANSFER', this)"
            >
              <label>
                <input
                  type="radio"
                  name="paymentMethod"
                  value="BANK_TRANSFER"
                />
                무통장입금
              </label>
              <div class="payment-details">
                <div
                  style="
                    padding: 12px;
                    background-color: #f9fafb;
                    border-radius: 6px;
                    margin-top: 8px;
                  "
                >
                  <div
                    style="font-size: 0.9em; color: #6b7280; margin-bottom: 4px"
                  >
                    입금 계좌
                  </div>
                  <div style="font-weight: 600; color: #111827">
                    국민은행 123456-78-901234 (예금주: Moamart)
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- 결제 요약 -->
      <div class="checkout-right">
        <div class="section" style="position: sticky; top: 20px">
          <h3 class="section-title">결제 요약</h3>

          <div class="summary-row">
            <span class="summary-label">총 상품 금액</span>
            <span
              class="summary-value"
              id="total-product-price"
              th:text="'₩' + ${#numbers.formatInteger(totalPrice, 0, 'COMMA')}"
            ></span>
          </div>

          <div class="summary-row total">
            <span class="summary-label">최종 결제 금액</span>
            <span
              class="summary-value total"
              id="final-price"
              th:text="'₩' + ${#numbers.formatInteger(finalPrice, 0, 'COMMA')}"
            ></span>
          </div>

          <div class="agreement-checkbox">
            <input type="checkbox" id="agreement" />
            <label for="agreement"
              >위 주문 내용을 확인하였으며, 결제에 동의합니다.</label
            >
          </div>

          <button
            type="button"
            class="payment-btn"
            id="payment-btn"
            onclick="processPayment()"
          >
            <span id="payment-btn-text">결제하기</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      // 할인 적용 토글
      function toggleDiscount() {
        const content = document.getElementById("discount-content");
        const arrow = document.getElementById("discount-arrow");
        content.classList.toggle("show");
        arrow.textContent = content.classList.contains("show") ? "▲" : "▼";
      }

      // 결제 방법 선택
      function selectPayment(method, element) {
        // 모든 payment-option에서 selected 클래스 제거
        document.querySelectorAll(".payment-option").forEach((el) => {
          el.classList.remove("selected");
        });

        // 선택한 옵션에 selected 클래스 추가
        element.classList.add("selected");

        // 라디오 버튼 체크
        element.querySelector('input[type="radio"]').checked = true;
      }

      // 최종 결제 금액 계산 (이미 서버에서 계산되어 전달됨)
      function calculateFinalPrice() {
        // 서버에서 계산된 finalPrice를 사용하므로 별도 계산 불필요
        const paymentBtnText = document.getElementById("payment-btn-text");
        const finalPriceElement = document.getElementById("final-price");
        if (finalPriceElement && paymentBtnText) {
          const finalPrice =
            parseInt(finalPriceElement.textContent.replace(/[^0-9]/g, "")) || 0;
          paymentBtnText.textContent =
            finalPrice.toLocaleString("ko-KR") + "원 결제하기";
        }
      }

      // 결제 처리
      function processPayment() {
        const agreement = document.getElementById("agreement");
        if (!agreement.checked) {
          alert("주문 내용 확인 및 결제 동의에 체크해주세요.");
          return;
        }

        const recipientName = document.getElementById("recipient-name").value;
        const recipientPhone = document.getElementById("recipient-phone").value;

        if (!recipientName || !recipientPhone) {
          alert("이름과 연락처를 모두 입력해주세요.");
          return;
        }

        const paymentMethod = document.querySelector(
          'input[name="paymentMethod"]:checked'
        );
        if (!paymentMethod) {
          alert("결제 방법을 선택해주세요.");
          return;
        }

        // 픽업 시간/분을 hidden input에 저장
        const pickupHour = document.getElementById("pickup-hour").value;
        const pickupMinute = document.getElementById("pickup-minute").value;
        document.getElementById("hidden-pickup-hour").value = pickupHour;
        document.getElementById("hidden-pickup-minute").value = pickupMinute;

        const paymentBtn = document.getElementById("payment-btn");
        paymentBtn.disabled = true;
        paymentBtn.textContent = "결제 처리 중...";

        // 폼 제출
        document.getElementById("checkout-form").submit();
      }

      // 페이지 로드 시 최종 결제 금액 계산
      document.addEventListener("DOMContentLoaded", function () {
        calculateFinalPrice();
      });
    </script>
  </body>
</html>

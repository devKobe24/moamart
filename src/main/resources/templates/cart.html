<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>장바구니 - Moamart</title>
    <style>
      body {
        font-family: "Apple SD Gothic Neo", sans-serif;
        background-color: #f8f9fa;
        margin: 0;
      }

      .navbar {
        background-color: white;
        padding: 15px 30px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo {
        font-size: 24px;
        font-weight: bold;
        color: #333;
        text-decoration: none;
      }

      .container {
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        margin-bottom: 30px;
        color: #333;
      }

      /* 테이블 스타일 */
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      th,
      td {
        padding: 15px;
        text-align: center;
        border-bottom: 1px solid #eee;
        vertical-align: middle;
      }
      th {
        background-color: #f1f3f5;
        font-weight: bold;
        color: #555;
      }

      /* 이미지 스타일 */
      .cart-img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid #ddd;
      }

      /* 총 결제 금액 영역 */
      .total-section {
        margin-top: 30px;
        background: white;
        padding: 30px;
        border-radius: 8px;
        text-align: right;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .total-label {
        font-size: 18px;
        color: #555;
        margin-right: 20px;
      }
      .total-price {
        font-size: 28px;
        font-weight: bold;
        color: #d32f2f;
      }

      /* 버튼 */
      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn-delete {
        background-color: #fff;
        border: 1px solid #ddd;
        color: #666;
      }
      .btn-delete:hover {
        background-color: #f8f9fa;
        color: #d32f2f;
        border-color: #d32f2f;
      }

      .btn-checkout {
        background-color: #007bff;
        color: white;
        padding: 15px 40px;
        font-size: 18px;
        font-weight: bold;
        margin-top: 20px;
      }
      .btn-checkout:hover {
        background-color: #0056b3;
      }

      /* 장바구니 비었을 때 */
      .empty-cart {
        text-align: center;
        padding: 80px 0;
        color: #888;
      }
      .btn-home {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #6c757d;
        color: white;
        text-decoration: none;
        border-radius: 4px;
      }

      /* 수량 조절기 스타일 */
      .quantity-control {
        display: flex;
        align-items: center;
        border: 1px solid #ddd;
        border-radius: 4px;
        overflow: hidden;
        background-color: white;
        width: fit-content;
        margin: 0 auto;
      }

      .quantity-control button {
        width: 30px;
        height: 30px;
        background-color: #f9f9f9;
        border: none;
        cursor: pointer;
        font-size: 16px;
        color: #555;
        transition: 0.1s;
      }

      .quantity-control button:hover {
        background-color: #eee;
      }

      .quantity-control button:active {
        background-color: #ddd;
      }

      .quantity-control button:disabled {
        background-color: #f5f5f5;
        color: #ccc;
        cursor: not-allowed;
      }

      .quantity-control button:disabled:hover {
        background-color: #f5f5f5;
      }

      .quantity-control input {
        width: 45px;
        height: 30px;
        text-align: center;
        border: none;
        border-left: 1px solid #ddd;
        border-right: 1px solid #ddd;
        font-size: 14px;
        font-weight: bold;
        outline: none;
        -moz-appearance: textfield;
      }

      .quantity-control input::-webkit-outer-spin-button,
      .quantity-control input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <a href="/" class="logo">🛍️ Moamart</a>
      <div>
        <a href="/" style="text-decoration: none; color: #555">계속 쇼핑하기</a>
      </div>
    </div>

    <div class="container">
      <h1>🛒 장바구니</h1>

      <div th:if="${cart.isEmpty()}" class="empty-cart">
        <h2>장바구니가 비어있습니다.</h2>
        <p>원하는 상품을 담아보세요!</p>
        <a href="/" class="btn-home">상품 보러가기</a>
      </div>

      <div th:unless="${cart.isEmpty()}">
        <table>
          <thead>
            <tr>
              <th style="width: 10%">이미지</th>
              <th style="width: 40%">상품명</th>
              <th style="width: 15%">단가</th>
              <th style="width: 10%">수량</th>
              <th style="width: 15%">금액</th>
              <th style="width: 10%">관리</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${cart}">
              <td>
                <img
                  th:if="${item.thumbnailUrl != null}"
                  th:src="${item.thumbnailUrl}"
                  class="cart-img"
                />
                <div
                  th:unless="${item.thumbnailUrl != null}"
                  style="
                    width: 60px;
                    height: 60px;
                    background: #eee;
                    margin: 0 auto;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    border-radius: 4px;
                    font-size: 10px;
                  "
                >
                  No Img
                </div>
              </td>
              <td
                th:text="${item.name}"
                style="text-align: left; padding-left: 20px; font-weight: bold"
              >
                상품명
              </td>
              <td
                th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'"
              >
                10,000원
              </td>
              <td>
                <div class="quantity-control">
                  <button
                    type="button"
                    th:id="'btn-decrease-' + ${item.productId}"
                    th:onclick="'changeQuantity(' + ${item.productId} + ', -1)'"
                  >
                    −
                  </button>
                  <input
                    type="number"
                    th:id="'quantity-' + ${item.productId}"
                    th:value="${item.quantity}"
                    th:attr="data-product-id=${item.productId}, data-max-quantity=${item.stockQuantity}"
                    min="1"
                    th:max="${item.stockQuantity}"
                    readonly
                    onchange="updateQuantityDirect(this)"
                  />
                  <button
                    type="button"
                    th:id="'btn-increase-' + ${item.productId}"
                    th:onclick="'changeQuantity(' + ${item.productId} + ', 1)'"
                  >
                    +
                  </button>
                </div>
              </td>
              <td
                th:id="'total-price-' + ${item.productId}"
                th:text="${#numbers.formatInteger(item.getTotalPrice(), 0, 'COMMA')} + '원'"
                th:data-unit-price="${item.price}"
                style="font-weight: bold"
              >
                10,000원
              </td>
              <td>
                <button
                  class="btn btn-delete"
                  th:onclick="'deleteItem(' + ${item.productId} + ')'"
                >
                  삭제
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <div class="total-section">
          <span class="total-label">총 결제 금액</span>
          <span
            class="total-price"
            id="total-price-display"
            th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')} + '원'"
            >0원</span
          >
          <br />
          <button
            class="btn btn-checkout"
            onclick="location.href='/orders/review'"
          >
            주문하기
          </button>
        </div>
      </div>
    </div>

    <script>
      // 수량 변경 함수
      function changeQuantity(productId, change) {
        const quantityInput = document.getElementById(`quantity-${productId}`);
        const currentQty = parseInt(quantityInput.value);
        const maxQty = parseInt(quantityInput.getAttribute('data-max-quantity'));
        
        let newQty = currentQty + change;
        if (newQty < 1) {
          newQty = 1;
        }
        if (newQty > maxQty) {
          newQty = maxQty;
        }

        // 수량 업데이트
        updateCartQuantity(productId, newQty);
      }

      // 직접 입력 시 수량 업데이트
      function updateQuantityDirect(input) {
        const productId = input.getAttribute('data-product-id');
        const newQty = parseInt(input.value);
        const maxQty = parseInt(input.getAttribute('data-max-quantity'));

        let validQty = newQty;
        if (validQty < 1) {
          validQty = 1;
          input.value = 1;
        }
        if (validQty > maxQty) {
          validQty = maxQty;
          input.value = maxQty;
        }

        updateCartQuantity(productId, validQty);
      }

      // 장바구니 수량 업데이트 API 호출
      function updateCartQuantity(productId, newQuantity) {
        const quantityInput = document.getElementById(`quantity-${productId}`);
        const btnDecrease = document.getElementById(`btn-decrease-${productId}`);
        const btnIncrease = document.getElementById(`btn-increase-${productId}`);
        const totalPriceElement = document.getElementById(`total-price-${productId}`);
        const maxQty = parseInt(quantityInput.getAttribute('data-max-quantity'));

        fetch(`/api/cart/${productId}`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            quantity: newQuantity
          })
        })
        .then((response) => {
          if (response.ok) {
            // 수량 업데이트
            quantityInput.value = newQuantity;

            // 버튼 상태 업데이트
            btnDecrease.disabled = newQuantity <= 1;
            btnIncrease.disabled = newQuantity >= maxQty;

            // 해당 상품의 총 가격 업데이트
            const unitPrice = parseInt(totalPriceElement.getAttribute('data-unit-price'));
            const newTotalPrice = unitPrice * newQuantity;
            totalPriceElement.textContent = new Intl.NumberFormat('ko-KR').format(newTotalPrice) + '원';

            // 전체 총 금액 재계산 및 업데이트
            updateTotalPrice();

            return response.text();
          } else {
            return response.text().then(errorMessage => {
              alert(errorMessage || "수량 변경에 실패했습니다.");
              // 실패 시 원래 값으로 복원
              location.reload();
            });
          }
        })
        .catch((error) => {
          console.error("Error:", error);
          alert("시스템 오류가 발생했습니다.");
          location.reload();
        });
      }

      // 전체 총 금액 재계산
      function updateTotalPrice() {
        const totalPriceDisplay = document.getElementById('total-price-display');
        let total = 0;

        // 각 상품의 단가와 수량을 곱해서 총액 계산
        document.querySelectorAll('[id^="quantity-"]').forEach(input => {
          const productId = input.getAttribute('data-product-id');
          const quantity = parseInt(input.value) || 0;
          const totalPriceElement = document.getElementById(`total-price-${productId}`);
          
          if (totalPriceElement) {
            const unitPrice = parseInt(totalPriceElement.getAttribute('data-unit-price')) || 0;
            total += unitPrice * quantity;
          }
        });

        totalPriceDisplay.textContent = new Intl.NumberFormat('ko-KR').format(total) + '원';
      }

      // 페이지 로드 시 버튼 상태 초기화
      document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('[id^="quantity-"]').forEach(input => {
          const productId = input.getAttribute('data-product-id');
          const currentQty = parseInt(input.value);
          const maxQty = parseInt(input.getAttribute('data-max-quantity'));
          
          const btnDecrease = document.getElementById(`btn-decrease-${productId}`);
          const btnIncrease = document.getElementById(`btn-increase-${productId}`);
          
          if (btnDecrease) btnDecrease.disabled = currentQty <= 1;
          if (btnIncrease) btnIncrease.disabled = currentQty >= maxQty;
        });
      });

      function deleteItem(productId) {
        if (!confirm("해당 상품을 장바구니에서 삭제하시겠습니까?")) return;

        fetch(`/api/cart/${productId}`, {
          method: "DELETE",
        })
          .then((response) => {
            if (response.ok) {
              // 성공 시 화면 새로고침하여 목록 갱신
              location.reload();
            } else {
              alert("삭제 실패했습니다.");
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("시스템 오류가 발생했습니다.");
          });
      }
    </script>
  </body>
</html>

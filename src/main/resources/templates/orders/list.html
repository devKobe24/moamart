<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>주문 내역 - Moamart</title>
    <style>
      body {
        font-family: "Apple SD Gothic Neo", sans-serif;
        background-color: #f8f9fa;
        margin: 0;
        padding: 20px;
      }

      .navbar {
        background-color: white;
        padding: 15px 30px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }
      .logo {
        font-size: 24px;
        font-weight: bold;
        color: #333;
        text-decoration: none;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      h1 {
        margin: 0;
        color: #333;
        font-size: 24px;
      }

      .btn-refresh {
        padding: 8px 16px;
        background-color: #28a745;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: bold;
        border: none;
        cursor: pointer;
      }
      .btn-refresh:hover {
        background-color: #218838;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }
      th,
      td {
        padding: 15px;
        text-align: center;
        border-bottom: 1px solid #eee;
      }
      th {
        background-color: #f1f3f5;
        font-weight: bold;
        color: #555;
      }
      tbody tr:hover {
        background-color: #f9f9f9;
      }

      .btn-detail {
        padding: 6px 12px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-size: 14px;
      }
      .btn-detail:hover {
        background-color: #0056b3;
      }

      .empty-message {
        text-align: center;
        padding: 60px;
        color: #999;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <a href="/" class="logo">🛍️ Moamart</a>
      <div>
        <a href="/" style="text-decoration: none; color: #555">홈으로</a>
      </div>
    </div>

    <div class="container">
      <div class="header">
        <h1>📋 주문 내역</h1>
        <button class="btn-refresh" onclick="location.reload()">
          현재 주문 상태 확인
        </button>
      </div>

      <div th:if="${orders.isEmpty()}" class="empty-message">
        주문 내역이 없습니다.
      </div>

      <table th:unless="${orders.isEmpty()}">
        <thead>
          <tr>
            <th style="width: 10%">주문번호</th>
            <th style="width: 20%">상품명</th>
            <th style="width: 15%">주문 금액</th>
            <th style="width: 15%">주문 상태</th>
            <th style="width: 15%">주문 일시</th>
            <th style="width: 15%">픽업 예정</th>
            <th style="width: 10%">상세</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="order : ${orders}">
            <td th:text="${order.id}">1</td>
            <td th:text="${order.productSummary}">상품명 외 2건</td>
            <td
              th:text="${#numbers.formatInteger(order.finalPaymentAmount, 0, 'COMMA')} + '원'"
            >
              15,000원
            </td>
            <td>
              <span th:switch="${order.status.name()}">
                <span th:case="'ORDER'">주문완료</span>
                <span th:case="'PREPARING'">상품준비중</span>
                <span th:case="'READY_FOR_PICKUP'">상품준비완료</span>
                <span th:case="'PICKUP_COMPLETED'">픽업완료</span>
                <span th:case="'RETURNED'">반품완료</span>
                <span th:case="'EXCHANGE'">상품교환</span>
                <span th:case="'OUT_OF_STOCK'">품절</span>
                <span th:case="'CANCEL'">주문취소</span>
                <span th:case="*" th:text="${order.status}">ORDER</span>
              </span>
            </td>
            <td
              th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}"
            >
              2024-01-01 14:00
            </td>
            <td
              th:text="${order.pickupDateTime != null ? #temporals.format(order.pickupDateTime, 'yyyy-MM-dd HH:mm') : '-'}"
            >
              2024-01-01 14:00
            </td>
            <td>
              <a th:href="@{/orders/{id}(id=${order.id})}" class="btn-detail"
                >상세</a
              >
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>

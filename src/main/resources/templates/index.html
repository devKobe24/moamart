<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Moamart - 모두를 위한 마켓</title>
    <style>
      /* 공통 스타일 */
      body {
        font-family: "Apple SD Gothic Neo", sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f8f9fa;
      }
      a {
        text-decoration: none;
        color: inherit;
      }

      /* 네비게이션 바 */
      .navbar {
        background-color: white;
        padding: 15px 30px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo {
        font-size: 24px;
        font-weight: bold;
        color: #333;
      }
      .menu a {
        margin-left: 20px;
        color: #555;
        font-size: 14px;
      }
      .menu a:hover {
        color: #007bff;
      }

      /* 메인 컨테이너 */
      .container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .section-title {
        font-size: 22px;
        margin-bottom: 20px;
        font-weight: bold;
        color: #333;
      }

      /* 상품 그리드 (반응형 카드 레이아웃) */
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 25px;
      }

      /* 상품 카드 디자인 */
      .card {
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        transition: transform 0.2s;
        cursor: pointer;
        position: relative;
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      /* 썸네일 영역 */
      .card-img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        background-color: #f0f0f0;
      }

      /* 품절 뱃지 */
      .sold-out-badge {
        position: absolute;
        top: 10px;
        left: 10px;
        background-color: rgba(0, 0, 0, 0.6);
        color: white;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 12px;
      }

      /* 상품 정보 */
      .card-body {
        padding: 15px;
      }
      .category {
        font-size: 12px;
        color: #888;
        margin-bottom: 5px;
      }
      .product-name {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .price {
        font-size: 18px;
        font-weight: bold;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <a href="/" class="logo">🛍️ Moamart</a>
      <div class="menu">
        <a href="#">로그인</a>
        <a href="/admin/products">관리자 페이지</a>
      </div>
    </div>

    <div class="container">
      <div class="section-title">✨ 최신 상품</div>

      <div
        th:if="${products.isEmpty()}"
        style="text-align: center; padding: 100px; color: #999"
      >
        등록된 상품이 없습니다. 관리자 페이지에서 상품을 등록해보세요!
      </div>

      <div class="product-grid">
        <a
          th:href="@{/products/{id}(id=${item.id})}"
          class="card"
          th:each="item : ${products.content}"
        >
          <img
            th:if="${item.thumbnailUrl != null}"
            th:src="${item.thumbnailUrl}"
            class="card-img"
          />
          <div
            th:unless="${item.thumbnailUrl != null}"
            class="card-img"
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              color: #aaa;
            "
          >
            No Image
          </div>

          <div
            class="sold-out-badge"
            th:if="${item.status.name() == 'SOLD_OUT'}"
          >
            품절
          </div>

          <div class="card-body">
            <div class="category" th:text="${item.categoryName}">카테고리</div>
            <div class="product-name" th:text="${item.name}">상품명</div>
            <div
              class="price"
              th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'"
            >
              10,000원
            </div>
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
